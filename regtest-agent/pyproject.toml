[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regtest-agent"
version = "2.0.0"
description = "LangGraph agent for regulation-driven test generation / reuse / knowledge engineering over the LLM4Fin, RAFT and CARE workflows"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.6", "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart",
  "httpx>=0.27", "jsonschema>=4", "pdfplumber", "python-docx",
]

[project.optional-dependencies]
llm = ["mlx-lm", "lm-format-enforcer"]
test = ["pytest>=8"]

[project.scripts]
regtest-agent = "regtest_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regtest_agent = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
